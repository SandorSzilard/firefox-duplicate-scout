<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Duplicate Scout icon</title>
  <desc id="desc">Two overlapping browser windows with a magnifying glass and green checkmark.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#44c7ff"/>
      <stop offset="100%" stop-color="#0a56ff"/>
    </linearGradient>
    <linearGradient id="windowTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dce8ff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dffaff"/>
      <stop offset="100%" stop-color="#8ddcff"/>
    </linearGradient>
  </defs>

  <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#bg)"/>

  <!-- Rear browser window -->
  <rect x="150" y="112" width="248" height="230" rx="28" fill="#f8fbff" stroke="#163f9b" stroke-width="18"/>
  <rect x="150" y="112" width="248" height="64" rx="28" fill="url(#windowTop)"/>
  <circle cx="184" cy="144" r="11" fill="#ff4c5b"/>
  <circle cx="218" cy="144" r="11" fill="#ffb11a"/>
  <circle cx="252" cy="144" r="11" fill="#20b34b"/>

  <!-- Front browser window -->
  <rect x="92" y="182" width="260" height="226" rx="28" fill="#ffffff" stroke="#163f9b" stroke-width="18"/>
  <rect x="92" y="182" width="260" height="62" rx="28" fill="url(#windowTop)"/>
  <circle cx="126" cy="213" r="11" fill="#ff4c5b"/>
  <circle cx="160" cy="213" r="11" fill="#ffb11a"/>
  <circle cx="194" cy="213" r="11" fill="#20b34b"/>

  <!-- Magnifying glass -->
  <circle cx="332" cy="332" r="96" fill="url(#glass)" stroke="#123b8e" stroke-width="22"/>
  <circle cx="332" cy="332" r="70" fill="#eafbff" opacity="0.8"/>
  <path d="M398 398 L458 458" stroke="#123b8e" stroke-width="28" stroke-linecap="round"/>
  <path d="M402 402 L456 456" stroke="#5bc6ff" stroke-width="14" stroke-linecap="round"/>

  <!-- Check -->
  <path d="M289 334 L321 366 L378 305"
        fill="none" stroke="#1ecb38" stroke-width="28"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
